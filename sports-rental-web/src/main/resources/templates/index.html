<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>體育器材租借系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; font-family: 'Microsoft JhengHei', sans-serif; scroll-behavior: smooth; }
        .sidebar { background-color: white; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 20px; }
        .sidebar-header { padding: 15px; background-color: #343a40; color: white; font-weight: bold; border-radius: 5px 5px 0 0; }
        .sidebar a { display: block; padding: 12px 15px; color: #333; text-decoration: none; border-bottom: 1px solid #eee; }
        .sidebar a:hover { background-color: #e9ecef; color: #0d6efd; padding-left: 20px; transition: 0.2s; }
        tr:target { animation: highlight 1.5s ease-out; }
        @keyframes highlight { from { background-color: #fff3cd; } to { background-color: transparent; } }
    </style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="m-0">🏀 校園體育器材租借系統</h2>
        <a href="/cart" class="btn btn-success btn-lg">
            🛒 查看購物車 / 結帳
        </a>
    </div>

    <div class="row">
        <div class="col-md-3">
            <div class="sidebar">
                <div class="sidebar-header">快速導航 (Quick Find)</div>
                <a href="#E001">🏀 籃球</a>
                <a href="#E002">🏐 排球</a>
                <a href="#E003">🏸 羽球拍</a>
                <a href="#E004">🏓 桌球拍</a>
            </div>
        </div>

        <div class="col-md-9">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">器材目錄 (Catalogue)</div>
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr><th>名稱</th><th>庫存</th><th>數量</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${equipments}" th:id="${item.equipmentID}">
                            <td>
                                <strong th:text="${item.name}">籃球</strong><br>
                                <small class="text-muted" th:text="${item.equipmentID}">E001</small>
                            </td>
                            <td><span class="badge bg-info text-dark" th:text="${item.availableStock}">10</span></td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <form action="/add" method="post" class="d-flex align-items-center me-2">
                                        <input type="hidden" name="id" th:value="${item.equipmentID}">
                                        <input type="number" name="quantity" value="1" min="1" class="form-control form-control-sm me-2" style="width: 70px;">
                                        <button type="submit" class="btn btn-sm btn-outline-success">加入</button>
                                    </form>
                                    <button type="button" class="btn btn-sm btn-outline-primary"
                                            data-bs-toggle="modal" data-bs-target="#detailModal"
                                            th:data-name="${item.name}" th:data-id="${item.equipmentID}"
                                            th:data-stock="${item.availableStock}" th:data-threshold="${item.auditThreshold}"
                                            onclick="showDetails(this)">ℹ️ 詳情</button>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white"><h5 class="modal-title">器材詳細資訊</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <h2 class="text-center mb-4" id="modalName">器材名稱</h2>
                <ul class="list-group">
                    <li class="list-group-item d-flex justify-content-between">ID <span class="badge bg-secondary rounded-pill" id="modalId"></span></li>
                    <li class="list-group-item d-flex justify-content-between">庫存 <span class="badge bg-info text-dark rounded-pill" id="modalStock"></span></li>
                    <li class="list-group-item d-flex justify-content-between">門檻 <span class="badge bg-warning text-dark rounded-pill" id="modalThreshold"></span></li>
                </ul>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="decisionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">✅ 加入成功</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <p class="fs-5" th:text="${message}">已加入清單</p>
                <p class="text-muted">請問您接下來要？</p>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-outline-secondary me-3" data-bs-dismiss="modal">⬅️ 繼續瀏覽</button>
                <a href="/cart" class="btn btn-success">前往租借 (Go to Checkout) ➡️</a>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    var serverMessage = /*[[${message}]]*/ null;
    var showDecision = /*[[${showDecisionModal}]]*/ false;

    window.onload = function() {
        if (showDecision) {
            var myModal = new bootstrap.Modal(document.getElementById('decisionModal'));
            myModal.show();
        } else if (serverMessage && serverMessage.includes("錯誤")) {
            alert("❌ " + serverMessage);
        }
    };

    function showDetails(button) {
        document.getElementById('modalName').innerText = button.getAttribute('data-name');
        document.getElementById('modalId').innerText = button.getAttribute('data-id');
        document.getElementById('modalStock').innerText = button.getAttribute('data-stock');
        document.getElementById('modalThreshold').innerText = button.getAttribute('data-threshold');
    }
    /*]]>*/
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>我的購物車 - 體育器材租借</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; font-family: 'Microsoft JhengHei', sans-serif; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>🛒 您的租借清單</h2>
                <a href="/" class="btn btn-outline-primary">⬅️ 返回目錄繼續借</a>
            </div>

            <div th:if="${message}" class="alert"
                 th:classappend="${message.contains('錯誤') ? 'alert-danger' : 'alert-success'}"
                 role="alert" th:text="${message}">
            </div>

            <div class="card shadow-sm border-success">
                <div class="card-header bg-success text-white">確認清單內容</div>
                <div class="card-body">

                    <ul class="list-group mb-4">
                        <li class="list-group-item" th:each="cartItem : ${cartItems}">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <div>
                                    <h5 class="my-0" th:text="${cartItem.equipment.name}">Product</h5>
                                    <small class="text-muted" th:text="'ID: ' + ${cartItem.equipment.equipmentID}">ID</small>
                                </div>
                                <form action="/remove" method="post" style="display:inline;">
                                    <input type="hidden" name="id" th:value="${cartItem.equipment.equipmentID}">
                                    <button type="submit" class="btn btn-outline-danger btn-sm">移除 ✕</button>
                                </form>
                            </div>

                            <form action="/update" method="post" class="d-flex align-items-center justify-content-end bg-light p-2 rounded">
                                <input type="hidden" name="id" th:value="${cartItem.equipment.equipmentID}">
                                <label class="me-2 text-muted fw-bold">租借數量:</label>
                                <input type="number" name="quantity" th:value="${cartItem.quantity}" min="1" class="form-control form-control-sm me-2" style="width: 80px;">
                                <button type="submit" class="btn btn-sm btn-secondary">更新數量</button>
                            </form>
                        </li>

                        <li class="list-group-item text-center text-muted py-5" th:if="${#lists.isEmpty(cartItems)}">
                            <h4>🛒 購物車是空的</h4>
                            <p>快去選一些器材吧！</p>
                            <a href="/" class="btn btn-primary mt-2">前往瀏覽器材</a>
                        </li>
                    </ul>

                    <form action="/checkout" method="post" th:unless="${#lists.isEmpty(cartItems)}">

                        <div th:if="${showAuditModal}" class="alert alert-warning border-warning p-4 mb-3">
                            <h4 class="alert-heading text-danger">⚠️ 需要管理員審核</h4>
                            <hr>
                            <p class="mb-2 fw-bold" th:text="${auditMsg}"></p>
                            <div class="mb-3">
                                <label class="form-label">請務必填寫詳細申請理由：</label>
                                <textarea name="reason" class="form-control" rows="3" placeholder="例如：12/25 系際盃籃球賽使用，預計借用3小時..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-warning w-100 btn-lg fw-bold">送出審核申請 📝</button>
                        </div>

                        <button th:unless="${showAuditModal}" type="submit" class="btn btn-success w-100 btn-lg py-3 fw-bold">
                            確認租借 (Confirm Checkout) ✅
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 防止重複提交的機制
    let isSubmitting = false;

    document.addEventListener('DOMContentLoaded', function() {
        // 為所有表單添加防重複提交
        document.querySelectorAll('form').forEach(function(form) {
            form.addEventListener('submit', function(e) {
                if (isSubmitting) {
                    e.preventDefault();
                    return false;
                }
                
                isSubmitting = true;
                
                // 禁用提交按鈕並顯示載入狀態
                const submitBtn = form.querySelector('button[type="submit"]');
                if (submitBtn) {
                    submitBtn.disabled = true;
                    const originalText = submitBtn.innerHTML;
                    
                    if (submitBtn.classList.contains('btn-success') || submitBtn.classList.contains('btn-warning')) {
                        // 結帳按鈕
                        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 處理中...';
                    } else {
                        // 其他按鈕
                        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 處理中';
                    }
                    
                    // 如果10秒後還沒完成，重新啟用按鈕
                    setTimeout(function() {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalText;
                        isSubmitting = false;
                    }, 10000);
                }
            });
        });

        // 當頁面即將被刷新時，重置提交狀態
        window.addEventListener('beforeunload', function() {
            isSubmitting = false;
        });
    });
</script>
</body>
</html>
